name: Release

# Publicar é ato deliberado, não efeito colateral de um merge.
#
# O ato deliberado é subir a versão. Um PR que muda o `config/version` do
# `project.godot` (`python tools/dev.py versao 0.0.6`) e entra na `master` vira
# release: esta pipeline vê que a versão ainda não tem tag, cria a `vX.Y.Z` no
# commit do merge e publica. Merge sem versão nova não publica nada - a tag já
# existe e a pipeline para no primeiro passo. É a mesma trava de antes, quando
# a release só saía de tag empurrada à mão: merge de rotina não distribui
# binário. Só que a decisão agora mora no diff do PR, onde dá pra revisar, e
# não num comando que alguém precisa lembrar de rodar depois do merge.
#
# A tag manual continua valendo, para republicar ou para soltar uma versão de
# um commit específico:
#
#   git tag v0.0.6 && git push origin v0.0.6
on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # Com LFS: sem isto o export empacota o ponteiro de texto no lugar de
      # cada .png e .glb, e o zip publicado sai sem os assets. Ver ci.yml.
      #
      # Histórico inteiro e tags: o changelog é o log desde a release anterior,
      # e o checkout raso padrão só traz o commit do merge.
      - uses: actions/checkout@v5
        with:
          lfs: true
          fetch-depth: 0

      # A tag e o config/version precisam contar a mesma história. Divergência
      # aqui publica um binário que se apresenta com outra versão que a do
      # nome do arquivo — o tipo de coisa que só se descobre depois.
      #
      # No push para a master não há tag ainda: ela sai da versão. Se já
      # existe, este merge não subiu a versão, e não há nada a publicar.
      - name: Decidir se há release
        id: versao
        run: |
          set -euo pipefail
          VERSION="$(python3 -c 'import sys; sys.path.insert(0, "tools"); import dev; print(dev.project_version())')"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
            echo "tag: ${TAG#v} | config/version: $VERSION"
            if [ "${TAG#v}" != "$VERSION" ]; then
              echo "::error::a tag $TAG não bate com config/version=$VERSION no project.godot"
              exit 1
            fi
          else
            TAG="v$VERSION"
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
              echo "::notice::$TAG já existe: este merge não subiu a versão, nada a publicar"
              echo "publicar=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "versão nova no project.godot: $TAG"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "publicar=true" >> "$GITHUB_OUTPUT"

      # Antes da engine e dos templates (~1 GB): merge sem versão nova para
      # aqui em segundos.
      - uses: ./.github/actions/setup-godot
        if: steps.versao.outputs.publicar == 'true'
        with:
          templates: "true"

      # Release só existe se o banco de provas passar. Binário quebrado
      # publicado é pior que release atrasada.
      - name: Banco de provas
        if: steps.versao.outputs.publicar == 'true'
        run: python tools/dev.py selftest

      # O mesmo comando que exporta na máquina de quem desenvolve, inclusive a
      # injeção da versão no bundle do macOS.
      - name: Exportar as três plataformas
        if: steps.versao.outputs.publicar == 'true'
        run: python tools/dev.py export

      - name: Empacotar
        if: steps.versao.outputs.publicar == 'true'
        run: |
          set -euo pipefail
          mkdir -p dist
          cp docs/INSTALAR.txt /tmp/LEIA-ME.txt

          (cd export/windows && zip -q -j ../../dist/RushFood-windows.zip \
            RushFood.exe /tmp/LEIA-ME.txt)
          (cd export/linux && zip -q -j ../../dist/RushFood-linux.zip \
            RushFood.x86_64 /tmp/LEIA-ME.txt)
          # O zip do macOS já vem pronto do Godot com o .app dentro; só
          # acrescenta o LEIA-ME em vez de reempacotar.
          cp export/macos/RushFood.zip dist/RushFood-macos.zip
          zip -q -j dist/RushFood-macos.zip /tmp/LEIA-ME.txt

          ls -lh dist/

      - name: Publicar a release
        if: steps.versao.outputs.publicar == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.versao.outputs.tag }}"

          # O que mudou vem primeiro: é o que quem já jogou a anterior procura.
          CHANGELOG="$(python3 tools/dev.py changelog "$TAG")"

          NOTES="$(cat <<NOTAS
          $CHANGELOG

          ---

          Protótipo greybox do RushFood, build de \`${GITHUB_SHA:0:7}\`.

          | Arquivo | Plataforma |
          | --- | --- |
          | \`RushFood-windows.zip\` | Windows x86_64 |
          | \`RushFood-linux.zip\` | Linux x86_64 |
          | \`RushFood-macos.zip\` | macOS universal (Intel e Apple Silicon) |

          Nenhum binário é assinado: o Windows mostra o aviso do SmartScreen e o
          macOS bloqueia na primeira abertura. O \`LEIA-ME.txt\` dentro de cada
          zip explica como passar, e traz os controles.
          NOTAS
          )"

          # Reempurrar a mesma tag substitui os binários em vez de falhar.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG já existe - substituindo os binários"
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" dist/* \
              --title "RushFood $TAG" \
              --notes "$NOTES" \
              --prerelease
          fi
