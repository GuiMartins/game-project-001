name: Release

# Publicar é ato deliberado, não efeito colateral de um merge.
#
# Antes, toda entrada na master virava release. Com IA operando no repositório
# isso é um botão de distribuir binário sem trava: um merge de rotina publicava
# pro mundo. Agora a release sai de uma tag `vX.Y.Z` empurrada de propósito —
# o merge continua rodando o banco de provas nos três sistemas (ci.yml), e
# quem decide que aquilo vira release é uma pessoa.
#
#   git tag v0.0.3 && git push origin v0.0.3
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-godot
        with:
          templates: "true"

      # A tag e o config/version precisam contar a mesma história. Divergência
      # aqui publica um binário que se apresenta com outra versão que a do
      # nome do arquivo — o tipo de coisa que só se descobre depois.
      - name: Conferir que a tag bate com o project.godot
        run: |
          set -euo pipefail
          VERSION="$(python -c 'import sys; sys.path.insert(0, "tools"); import dev; print(dev.project_version())')"
          TAG="${GITHUB_REF_NAME#v}"
          echo "tag: $TAG | config/version: $VERSION"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::a tag v$TAG não bate com config/version=$VERSION no project.godot"
            exit 1
          fi

      # Release só existe se o banco de provas passar. Binário quebrado
      # publicado é pior que release atrasada.
      - name: Banco de provas
        run: python tools/dev.py selftest

      # O mesmo comando que exporta na máquina de quem desenvolve, inclusive a
      # injeção da versão no bundle do macOS.
      - name: Exportar as três plataformas
        run: python tools/dev.py export

      - name: Empacotar
        run: |
          set -euo pipefail
          mkdir -p dist
          cp docs/INSTALAR.txt /tmp/LEIA-ME.txt

          (cd export/windows && zip -q -j ../../dist/RushFood-windows.zip \
            RushFood.exe /tmp/LEIA-ME.txt)
          (cd export/linux && zip -q -j ../../dist/RushFood-linux.zip \
            RushFood.x86_64 /tmp/LEIA-ME.txt)
          # O zip do macOS já vem pronto do Godot com o .app dentro; só
          # acrescenta o LEIA-ME em vez de reempacotar.
          cp export/macos/RushFood.zip dist/RushFood-macos.zip
          zip -q -j dist/RushFood-macos.zip /tmp/LEIA-ME.txt

          ls -lh dist/

      - name: Publicar a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"

          NOTES="$(cat <<NOTAS
          Protótipo greybox do RushFood, build de \`${GITHUB_SHA:0:7}\`.

          | Arquivo | Plataforma |
          | --- | --- |
          | \`RushFood-windows.zip\` | Windows x86_64 |
          | \`RushFood-linux.zip\` | Linux x86_64 |
          | \`RushFood-macos.zip\` | macOS universal (Intel e Apple Silicon) |

          Nenhum binário é assinado: o Windows mostra o aviso do SmartScreen e o
          macOS bloqueia na primeira abertura. O \`LEIA-ME.txt\` dentro de cada
          zip explica como passar, e traz os controles.
          NOTAS
          )"

          # Reempurrar a mesma tag substitui os binários em vez de falhar.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG já existe - substituindo os binários"
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" dist/* \
              --title "RushFood $TAG" \
              --notes "$NOTES" \
              --prerelease
          fi
