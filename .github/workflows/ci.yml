name: CI

# O banco de provas roda o jogo de verdade contra entradas sintéticas e sai
# com código 1 se algum número cair fora da faixa jogável. Rodar isso a cada
# push é o que impede a master de receber um PR quebrado - e na master todo
# merge que sobe a versão vira release.
#
# Roda nos três sistemas operacionais porque o jogo é desenvolvido nos três.
# Não é zelo: o binário padrão do Godot no Windows é GUI-subsystem e engole a
# saída quando redirecionada, então o banco de provas passava em silêncio, sem
# imprimir um número. Uma matrix de um SO só nunca veria isso.
#
# `push` so na master, e o resto pelo `pull_request`. Com `push` em toda
# branch, cada commit de PR rodava duas vezes, a mesma matrix com o mesmo
# codigo. O preco: branch sem PR nao tem CI sozinha. Para testar uma antes de
# abrir o PR, `gh workflow run CI --ref <branch>`.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  # O que mudou. Commit que so mexe em markdown e em `docs/` nao muda nada que
  # o jogo carregue nem que os testes leiam (`docs/` tem `.gdignore`, e as
  # referencias de la so entram no `dev.py prova`, que nao roda aqui), e
  # rodar a matrix inteira por ele e quase meia hora de runner jogada fora.
  #
  # Os jobs pesados pulam, em vez de o workflow inteiro usar `paths-ignore`:
  # workflow que nao dispara nao reporta check nenhum, e a master exige
  # `banco-de-provas` e `regressao-visual` - o PR de markdown ficaria
  # esperando para sempre. Job pulado por `if` reporta "skipped", que a
  # protecao aceita.
  #
  # Na duvida, roda: disparo manual sempre testa tudo, e qualquer arquivo fora
  # da lista (inclusive este workflow) conta como codigo.
  mudancas:
    runs-on: ubuntu-latest
    outputs:
      codigo: ${{ github.event_name == 'workflow_dispatch' || steps.filtro.outputs.codigo == 'true' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filtro
        with:
          # `every`: o arquivo so conta como codigo se escapar de TODOS os
          # padroes. Com o `some` de fabrica, um `.md` casaria o `**` e
          # contaria.
          predicate-quantifier: every
          filters: |
            codigo:
              - "**"
              - "!**/*.md"
              - "!docs/**"

  # Estilo não depende de sistema operacional, então roda uma vez só.
  # Rápido de propósito: falha de formatação aparece antes de a matrix inteira
  # terminar, e o conserto é `python tools/dev.py format`.
  qualidade:
    needs: mudancas
    if: needs.mudancas.outputs.codigo == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint
        run: python tools/dev.py lint
      - name: Formatação
        run: python tools/dev.py format --check

  provas:
    needs: mudancas
    if: needs.mudancas.outputs.codigo == 'true'
    strategy:
      # Sem fail-fast: quando um SO diverge, o que interessa é saber quais
      # outros divergiram junto. Cancelar os irmãos esconde exatamente isso.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}
    name: provas (${{ matrix.os }})

    steps:
      # Com LFS: os .png e .glb do jogo moram no Git LFS (ver .gitattributes).
      # Sem isto o checkout traz o ponteiro de texto no lugar do arquivo, o
      # Godot falha ao importar e - o pior - nao derruba nada enquanto nenhuma
      # cena usa o asset. No dia em que uma usa, quebra aqui, e so aqui: na
      # maquina de quem desenvolve o LFS esta instalado e tudo passa.
      - uses: actions/checkout@v5
        with:
          lfs: true

      - uses: ./.github/actions/setup-godot

      # Unitarios primeiro: 4 s contra 89 s. Quando os dois quebram, o que
      # aponta a causa e quase sempre o pequeno.
      - name: Testes unitarios
        run: python tools/dev.py test

      - name: Banco de provas
        run: python tools/dev.py selftest

  # Regressao visual. Job separado, e so no Linux, por um motivo tecnico: a
  # captura de tela NAO funciona em headless - sob o driver dummy o viewport
  # nao renderiza e saem zero PNGs, sem erro nenhum. Precisa de display, e
  # xvfb da um sem precisar de GPU.
  #
  # Ele pega o que nenhuma medida de fisica pega: a tela ficar errada por
  # inteiro. O caso registrado no PROTOTIPO.md e a pista sumindo por backface
  # culling, que o Godot descarta sem um erro no console.
  regressao-visual:
    needs: mudancas
    if: needs.mudancas.outputs.codigo == 'true'
    runs-on: ubuntu-latest
    steps:
      # Com LFS pelo mesmo motivo do job de provas, e aqui pesa mais: e o
      # unico job que olha a tela, e ponteiro no lugar de textura vira modelo
      # sumido no frame.
      - uses: actions/checkout@v5
        with:
          lfs: true

      - uses: ./.github/actions/setup-godot

      - name: Display virtual e driver de software
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb mesa-vulkan-drivers

      - name: Regressao visual
        # LIBGL_ALWAYS_SOFTWARE porque o runner nao tem GPU. O baseline tolera
        # 12%: e software rendering contra a GPU de quem gravou o baseline, e
        # estreitar isso troca regressao por alarme falso.
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a --server-args="-screen 0 1280x720x24" python tools/dev.py shots

      - name: Guardar os frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frames
          path: .dev/shots/*.png
          if-no-files-found: warn
          retention-days: 7

  # Agregador. As branches protegidas exigem um check chamado exatamente
  # "banco-de-provas", e uma matrix nunca produz um check com esse nome - ela
  # produz um por sistema. Em vez de afrouxar a proteção pra caber na matrix,
  # este job mantém o nome e só passa quando os três sistemas passam. Ele é o
  # portão; os outros são a evidência.
  #
  # Quando so mudou markdown, os dois pularam e ele passa dizendo isso. Mas so
  # nesse caso: "skipped" por qualquer outro motivo (um job que dependia de um
  # que falhou) continua reprovando.
  banco-de-provas:
    needs: [mudancas, qualidade, provas]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Conferir os três sistemas
        run: |
          if [ "${{ needs.mudancas.result }}" = "success" ] &&              [ "${{ needs.mudancas.outputs.codigo }}" = "false" ]; then
            echo "::notice::só markdown e docs/ mudaram: provas puladas"
            exit 0
          fi
          echo "qualidade: ${{ needs.qualidade.result }}"
          echo "provas:    ${{ needs.provas.result }}"
          if [ "${{ needs.qualidade.result }}" != "success" ] ||              [ "${{ needs.provas.result }}" != "success" ]; then
            echo "::error::algum job não passou"
            exit 1
          fi
