name: Instalar Godot
description: >
  Instala a versão fixada em .godot-version usando tools/dev.py, com cache.
  É o mesmo caminho do desenvolvimento local, de propósito.

# Esta action não baixa nada por conta própria: ela delega pro tools/dev.py,
# o mesmo comando que a pessoa (ou o agente) roda na máquina dela. Enquanto
# eram dois caminhos diferentes, "passa aqui e quebra lá" era questão de
# tempo — e a versão da engine vivia em três lugares que discordavam.
inputs:
  templates:
    description: "true pra baixar também os export templates (~1 GB). Só o export precisa."
    required: false
    default: "false"

outputs:
  version:
    description: "A versão instalada, lida de .godot-version"
    value: ${{ steps.pin.outputs.version }}

runs:
  using: composite
  steps:
    - name: Ler a versão fixada
      id: pin
      shell: bash
      run: |
        set -euo pipefail
        VERSION="$(tr -d '[:space:]' < .godot-version)"
        echo "versão fixada: $VERSION"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    # Guarda a engine e os zips baixados. Os export templates são extraídos
    # pra pasta de dados do Godot, que fica fora daqui — mas o .tpz de origem
    # é cacheado, então um cache-hit re-extrai sem baixar 1 GB de novo.
    - name: Cache da toolchain
      uses: actions/cache@v5
      with:
        path: .dev
        key: godot-${{ runner.os }}-${{ steps.pin.outputs.version }}-tpl${{ inputs.templates }}-v1

    - name: Instalar a engine
      shell: bash
      run: |
        set -euo pipefail
        if [ "${{ inputs.templates }}" = "true" ]; then
          python tools/dev.py setup
        else
          python tools/dev.py setup --skip-templates
        fi
        python tools/dev.py doctor
