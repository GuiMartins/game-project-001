name: Instalar Godot
description: Baixa o Godot headless e os export templates, com cache, e importa o projeto.

inputs:
  version:
    description: "Versão do Godot, ex. 4.7.2"
    required: true

runs:
  using: composite
  steps:
    # Godot + templates dão ~1,5 GB de download. Sem cache, todo run paga isso.
    - name: Cache do Godot
      id: cache-godot
      uses: actions/cache@v4
      with:
        path: |
          ~/godot-bin
          ~/.local/share/godot/export_templates
        key: godot-${{ inputs.version }}-v1

    - name: Baixar Godot e os templates
      if: steps.cache-godot.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        V="${{ inputs.version }}"
        BASE="https://github.com/godotengine/godot/releases/download/${V}-stable"
        mkdir -p ~/godot-bin "$HOME/.local/share/godot/export_templates"

        curl -fsSL -o /tmp/godot.zip "$BASE/Godot_v${V}-stable_linux.x86_64.zip"
        unzip -q /tmp/godot.zip -d ~/godot-bin
        mv ~/godot-bin/Godot_v${V}-stable_linux.x86_64 ~/godot-bin/godot
        chmod +x ~/godot-bin/godot

        curl -fsSL -o /tmp/templates.tpz "$BASE/Godot_v${V}-stable_export_templates.tpz"
        unzip -q /tmp/templates.tpz -d /tmp/tpl
        # O nome da pasta sai do version.txt do pacote, não de um palpite:
        # 4.7.2 vira "4.7.2.stable", mas um beta viraria outra coisa.
        VER="$(cat /tmp/tpl/templates/version.txt)"
        mkdir -p "$HOME/.local/share/godot/export_templates/$VER"
        mv /tmp/tpl/templates/* "$HOME/.local/share/godot/export_templates/$VER/"

    - name: Pôr o Godot no PATH
      shell: bash
      run: echo "$HOME/godot-bin" >> "$GITHUB_PATH"

    # Um class_name novo só entra no cache de classes globais pelo scan do
    # editor. Sem este passo o projeto não compila e o Godot headless trava
    # sem imprimir nada — foi exatamente o que aconteceu ao criar WorldTuning.
    - name: Importar o projeto
      shell: bash
      run: godot --headless --path . --import
